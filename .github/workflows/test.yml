name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Show Forge version
        run: forge --version

      - name: Export initial formatter diagnostics
        run: |
          forge fmt
          python3 - <<'PY'
          import json, pathlib
          for folder in ('src', 'test'):
              for path in pathlib.Path(folder).glob('*.sol'):
                  print('SYNCRATE_FORMAT_JSON=' + json.dumps({'path': str(path), 'content': path.read_text()}))
          PY

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
